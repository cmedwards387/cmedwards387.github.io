<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Money Tracker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #amount {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        #rate {
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        button {
            font-size: 1rem;
            padding: 0.5rem 1rem;
            margin: 0.25rem;
        }
    </style>
</head>
<body>
<div id="amount">$0.00</div>

<div id="rate">
    Hourly rate:
    <input id="rateInput" type="number" value="19.5" step="0.01">
    / hour
</div>

<div>
    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
</div>

<script>
    let hourlyRate = 19.5;
    let running = false;
    let startTime = null;
    let baseAmount = 0;
    let timerId = null;

    const amountEl = document.getElementById("amount");
    const rateInput = document.getElementById("rateInput");

    function updateAmount() {
        if (!running || startTime === null) return;
        const now = Date.now();
        const elapsedSeconds = (now - startTime) / 1000;
        const current = baseAmount + hourlyRate * (elapsedSeconds / 3600);
        amountEl.textContent = "$" + current.toFixed(2);
    }

    function start() {
        if (running) return;
        hourlyRate = parseFloat(rateInput.value) || 0;
        startTime = Date.now();
        running = true;

        if (!timerId) {
            timerId = setInterval(updateAmount, 50);
        }
    }

    function pause() {
        if (!running) return;
        updateAmount();
        running = false;
        startTime = null;
        const text = amountEl.textContent.replace("$", "");
        baseAmount = parseFloat(text) || 0;
    }

    function reset() {
        running = false;
        startTime = null;
        baseAmount = 0;
        amountEl.textContent = "$0.00";
    }

    document.getElementById("startBtn").onclick = start;
    document.getElementById("pauseBtn").onclick = pause;
    document.getElementById("resetBtn").onclick = reset;
</script>
</body>
</html>
